<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aptis for Teachers — Speaking Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F1;
    --paper:#FFFFFF;
    --ink:#221F2C;
    --ink-soft:#655F70;
    --accent:#2C1B54;
    --accent-soft:#EEE9F8;
    --teal:#3E7A70;
    --teal-soft:#E7F1EE;
    --warn:#B6512F;
    --warn-soft:#F7E9E3;
    --line:#E2D9C8;
    --gold:#B58A3E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Source Serif 4',serif;}
  .app{max-width:980px;margin:0 auto;padding:28px 20px 80px;}

  /* ---------- top rail ---------- */
  .railwrap{position:sticky;top:0;background:var(--bg);z-index:5;padding-top:6px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:28px;}
  .brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
  .brand-name{font-size:13px;letter-spacing:.02em;color:var(--ink-soft);}
  .brand-name b{color:var(--accent);}
  .rail{display:flex;gap:0;}
  .rail-step{flex:1;position:relative;padding-bottom:10px;}
  .rail-step .bar{height:3px;background:var(--line);border-radius:0;}
  .rail-step.done .bar{background:var(--teal);}
  .rail-step.active .bar{background:var(--accent);}
  .rail-step .lbl{font-size:11.5px;margin-top:6px;color:var(--ink-soft);font-weight:500;}
  .rail-step.active .lbl{color:var(--accent);font-weight:700;}
  .rail-step:not(:last-child){margin-right:8px;}

  /* ---------- generic cards ---------- */
  .card{background:var(--paper);border:1px solid var(--line);padding:26px;}
  .eyebrow{font-size:13px;color:var(--ink-soft);margin-bottom:4px;}
  .pagetitle{font-size:26px;margin:0 0 10px;}
  .lede{color:var(--ink-soft);font-size:15px;max-width:62ch;}
  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;
    padding:11px 22px;cursor:pointer;transition:opacity .15s ease;
  }
  .btn:hover{opacity:.88;}
  .btn.secondary{background:transparent;color:var(--accent);}
  .btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btnrow{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;}

  /* ---------- landing ---------- */
  .setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:20px;}
  @media (max-width:760px){.setgrid{grid-template-columns:1fr;}}
  .setcard{border:1px solid var(--line);padding:18px;cursor:pointer;background:var(--paper);text-align:left;}
  .setcard:hover{border-color:var(--accent);}
  .setcard.picked{border-color:var(--accent);background:var(--accent-soft);}
  .setcard h3{margin:0 0 6px;font-size:17px;}
  .setcard p{margin:0;font-size:13.5px;color:var(--ink-soft);}
  .structure{margin-top:26px;border-top:1px solid var(--line);padding-top:18px;}
  .structure ol{padding-left:20px;margin:10px 0 0;}
  .structure li{margin-bottom:6px;font-size:14.5px;}
  .structure li b{color:var(--accent);}

  /* ---------- exam layout ---------- */
  .exam{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start;}
  @media (max-width:760px){.exam{grid-template-columns:1fr;}}
  .prompt-pane{background:var(--paper);border:1px solid var(--line);padding:26px;min-height:280px;}
  .kicker{font-size:13px;color:var(--ink-soft);margin-bottom:2px;}
  .stepname{font-size:20px;margin:0 0 18px;}
  .question-text{font-size:19px;font-family:'Source Serif 4',serif;line-height:1.45;margin:14px 0;}
  .scene{width:100%;border:1px solid var(--line);background:#fff;margin:10px 0 14px;}
  .scene-cap{font-size:13px;color:var(--ink-soft);margin-top:-6px;margin-bottom:12px;}
  .compare-scenes{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .think-notes{width:100%;min-height:110px;border:1px solid var(--line);padding:12px;font-family:inherit;font-size:14px;resize:vertical;margin-top:10px;}
  .subq-list{margin:12px 0 0;padding-left:20px;}
  .subq-list li{font-size:15.5px;margin-bottom:6px;font-family:'Source Serif 4',serif;}

  /* ---------- recorder panel ---------- */
  .rec-panel{background:var(--paper);border:1px solid var(--line);padding:20px;text-align:center;position:sticky;top:98px;}
  .rec-state{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--ink-soft);margin-bottom:14px;}
  .rec-state.live{color:var(--warn);}
  .timer-ring{width:130px;height:130px;margin:0 auto 14px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;position:relative;}
  .timer-ring.live{border-color:var(--warn);}
  .timer-num{font-size:30px;font-weight:700;color:var(--accent);}
  .timer-ring.live .timer-num{color:var(--warn);}
  .wave{height:24px;display:flex;align-items:center;justify-content:center;gap:2px;margin-bottom:10px;}
  .wave span{width:3px;background:var(--warn);border-radius:2px;height:4px;transition:height .12s ease;}
  .rec-hint{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;min-height:16px;}
  .rec-btnrow{display:flex;flex-direction:column;gap:8px;}
  .btn.small{padding:8px 14px;font-size:13px;}
  audio{width:100%;margin-top:10px;}
  .mic-note{font-size:11.5px;color:var(--ink-soft);margin-top:12px;border-top:1px solid var(--line);padding-top:10px;}

  /* ---------- review ---------- */
  .review-item{border:1px solid var(--line);background:var(--paper);padding:20px;margin-bottom:16px;}
  .review-q{font-family:'Source Serif 4',serif;font-size:17px;margin:0 0 10px;}
  .review-audio{margin-bottom:14px;}
  .model{background:var(--teal-soft);border-left:3px solid var(--teal);padding:14px 16px;margin-bottom:12px;}
  .model .lbl{font-size:12px;font-weight:700;color:var(--teal);letter-spacing:.02em;margin-bottom:6px;}
  .model p{margin:0;font-size:14.5px;font-family:'Source Serif 4',serif;font-style:italic;color:#233;}
  .tips{margin:0;padding-left:18px;font-size:14px;}
  .tips li{margin-bottom:5px;}
  .vocab{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .vocab span{background:var(--accent-soft);color:var(--accent);font-size:12.5px;padding:3px 9px;font-weight:600;}
  .criteria-note{background:var(--warn-soft);border-left:3px solid var(--gold);padding:12px 16px;font-size:13px;color:#4a3a20;margin-top:20px;}

  /* ---------- summary ---------- */
  .checklist{display:grid;gap:10px;margin-top:18px;}
  .checkrow{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:12px 14px;background:var(--paper);}
  .checkrow input{margin-top:3px;}
  .checkrow span{font-size:14.5px;}
</style>
</head>
<body>
<div class="app" id="app"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F3E9"/><stop offset="1" stop-color="#E9E0CB"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAE1C9"/><stop offset="1" stop-color="#D6C7A3"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE1EE"/><stop offset="1" stop-color="#E7F3F6"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9CBE84"/><stop offset="1" stop-color="#7FA968"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">

    </linearGradient>
    <radialGradient id="shadowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>

  </defs>
</svg>

<script>

    <ellipse cx="0" cy="38" rx="15" ry="4.5" fill="url(#shadowGrad)"/>
    <rect x="-13" y="12" width="7" height="20" rx="3.5" fill="${shirt}"/>
    <rect x="6" y="12" width="7" height="20" rx="3.5" fill="${shirt}"/>
    <path d="M-11,6 Q0,-1 11,6 L11,33 Q0,39 -11,33 Z" fill="${shirt}"/>
    <circle cx="0" cy="-7" r="11.5" fill="${skin}"/>
    <path d="M-11.5,-9 Q-12,-21 0,-21 Q12,-21 11.5,-9 Q9,-17 0,-17 Q-9,-17 -11.5,-9 Z" fill="${hair}"/>
    <circle cx="-4.2" cy="-7" r="1.2" fill="#2B2320"/>
    <circle cx="4.2" cy="-7" r="1.2" fill="#2B2320"/>
    <path d="M-3,-2.5 Q0,-1 3,-2.5" stroke="#8a5a45" stroke-width="1" fill="none" stroke-linecap="round"/>

}
function desk(x,y,w,h,c){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;}

  talkStudent: svgWrap(`

  footballGame: svgWrap(`

    <rect x="473" y="105" width="8" height="70" fill="#fff"/>
    ${person(110,205,1.15,SKINS[0],SHIRTS[0])}
    ${person(195,212,1.1,SKINS[1],SHIRTS[3])}
    ${person(275,206,1.15,SKINS[2],SHIRTS[5])}
    <circle cx="225" cy="228" r="9" fill="#fff" stroke="#333" stroke-width="1.5"/>

  mentorObserve: svgWrap(`
    <rect width="520" height="260" fill="url(#wallGrad)"/>
    <rect x="30" y="20" width="190" height="55" fill="url(#boardGrad)"/>
    ${person(115,140,1.2,SKINS[0],SHIRTS[0])}

    tips:["ในข้อแรก เล่าเหตุการณ์เฉพาะเจาะจง (a student who said...) ดีกว่าพูดกว้าง ๆ — ทำให้คำตอบมีเรื่องราว","เชื่อม 3 คำตอบด้วยวลี เช่น 'In situations like that...' และ 'What really keeps me going...' เพื่อให้ลื่นไหลเป็นเรื่องเดียวกัน ไม่ใช่ตอบทีละข้อแยกกัน","ประโยคสุดท้ายสรุปด้วย mindset/หลักคิดส่วนตัว ทำให้ผู้ฟังรู้สึกว่าเป็นคำตอบที่จริงใจและมีความลึก","ฝึกพูดให้เวลาใกล้เคียงกันทั้ง 3 ข้อ (~40 วินาทีต่อข้อ) จะช่วยให้ discourse สมดุล"],
    vocab:["step by step","expect too much","a fair chance","burn out"]}
  ]},
D:{

  parts:[

  { title:"Part Two", kind:"single", image:"feedbackClass",
    instruction:"บรรยายภาพ 1 ภาพ จากนั้นตอบคำถามต่อเนื่องอีก 2 ข้อ — ข้อละ 45 วินาที",
    caption:"A teacher handing back marked work to a student at a desk.",
    items:[
      {time:45, q:"Describe this picture.",
       model:"In the picture, a teacher is handing a piece of marked work back to a student sitting at a desk. The student looks like they're waiting to hear some comments about it. It seems like a fairly calm, one-to-one moment, probably after a written assignment has been checked.",
       tips:["บรรยายจากสิ่งที่ 'กำลังเกิดขึ้น' (handing back) ก่อน แล้วค่อยขยายไปสิ่งที่เดา (probably after...)","ใช้ 'It seems like / probably' เมื่อบรรยายสิ่งที่ไม่แน่ใจ 100% จากภาพ","เน้นคำว่า 'one-to-one' เพื่อบรรยายลักษณะปฏิสัมพันธ์ในภาพให้ชัดเจน"],
       vocab:["marked work","one-to-one","written assignment"]},
      {time:45, q:"How do you give feedback to students on their work?",
       model:"I try to give a mix of written comments and a short face-to-face chat, because writing alone can feel quite impersonal, especially for younger students. I always start with something positive before pointing out what needs improving, so students don't feel discouraged.",
       tips:["ใช้ 'a mix of...' อีกครั้งเพื่อแสดงวิธีการที่หลากหลาย (เหมือนคำตอบข้อ Part1 คำถามแรก — ฝึกใช้โครงสร้างนี้ให้คล่อง)","อธิบายลำดับขั้นตอน (I always start with... before...) ให้เห็นภาพวิธีทำงานจริง","ปิดท้ายด้วยเหตุผลเชิงความรู้สึกของนักเรียน (discouraged) เพื่อแสดงความเข้าใจผู้เรียน"],
       vocab:["impersonal","point out","discouraged"]},
      {time:45, q:"Why is feedback important for language learners?",

       tips:["ยกตัวอย่างเฉพาะเจาะจง (a small grammar error) แทนพูดกว้าง ๆ ว่า 'it's important'","ใช้โครงสร้าง 'Without X, Y can happen' เพื่อแสดงผลลัพธ์ทางลบถ้าไม่มี feedback","จบด้วยผลระยะยาว (harder to correct later on) เพื่อเพิ่มน้ำหนักเหตุผล"],
       vocab:["notice (a mistake)","repeat (a mistake)","become a habit"]}
    ]},
  { title:"Part Three", kind:"compare", images:["onlineHome","wholeClass"],
    instruction:"เปรียบเทียบภาพ 2 ภาพ จากนั้นตอบคำถามต่อเนื่องอีก 2 ข้อ — ข้อละ 45 วินาที",
    captionA:"A student studying at home on a laptop.",
    captionB:"A full classroom of students with a teacher at the front.",
    items:[
      {time:45, q:"Tell me what you see in the two pictures.",
       model:"The first picture shows a student studying alone at home, using a laptop, probably for an online lesson. The second picture shows a full classroom with many students and a teacher at the front, which is a much more traditional learning environment. The two settings look very different in terms of how much social interaction is happening.",
       tips:["ใช้ 'probably for...' เพื่อเดาบริบทของภาพอย่างสมเหตุสมผล","ใช้คำว่า 'traditional' เพื่อเปรียบเทียบกับภาพแรกที่ไม่ใช่รูปแบบดั้งเดิม","สรุปด้วยมุมมองเชิงเปรียบเทียบ (in terms of...) เพื่อให้คำตอบมีทิศทางชัดเจน"],
       vocab:["social interaction","traditional","learning environment"]},
      {time:45, q:"Describe what it would be like to teach a lesson using one of these two settings.",
       model:"Teaching a full classroom would mean I could react instantly to body language and group energy, which is something you lose almost completely online. On the other hand, teaching one student online would let me focus entirely on their individual pace, without needing to manage the whole class at once.",
       tips:["ใช้ 'would mean / would let' เพราะเป็นสถานการณ์สมมติทั้งคู่","ใช้ 'On the other hand' เพื่อเปรียบเทียบสองฝั่งอย่างสมดุล","เน้นคำเฉพาะทาง เช่น body language, individual pace เพื่อแสดง vocabulary range"],
       vocab:["body language","group energy","individual pace"]},
      {time:45, q:"How important is it for students to have access to technology for learning outside school?",
       model:"I think it's becoming increasingly important, since so many resources — videos, practice exercises, even extra classes — are now online. That said, not every student has equal access to devices or a stable internet connection, so schools also need to make sure technology doesn't create a bigger gap between students.",
       tips:["ใช้ 'increasingly important' แทน 'very important' เพื่อแสดงมุมมองที่มีพัฒนาการตามเวลา","ยกตัวอย่างทรัพยากรเฉพาะ (videos, practice exercises) เพื่อสนับสนุนความเห็น","เพิ่มมุมกังวล (not every student has equal access) เพื่อแสดงว่ามองรอบด้าน ไม่ใช่มองบวกอย่างเดียว"],
       vocab:["equal access","stable connection","create a gap"]}
    ]},
  { title:"Part Four", kind:"extended", image:"parentMeeting", prepTime:60, answerTime:120,

    caption:"A teacher talking with a parent about a student's progress.",

    tips:["เริ่มด้วยเหตุการณ์เฉพาะเจาะจง (Last term, I spoke with...) เพื่อให้คำตอบมีเรื่องราวน่าติดตาม","ใช้ 'That conversation really changed...' เชื่อมจากข้อ 1 ไปข้อ 2 อย่างเป็นธรรมชาติ","ใช้ 'Overall, I'd say...' เปิดคำตอบข้อสุดท้ายเพื่อส่งสัญญาณว่ากำลังสรุป","แบ่งเวลาให้ใกล้เคียงกันทั้ง 3 ข้อ และฝึกพูดให้ประโยคเชื่อมกันลื่นไหลเหมือนเล่าเรื่องเดียว ไม่ใช่ตอบทีละข้อแยกกัน"],
    vocab:["hand in (homework)","notice (something)","affect (grades/confidence)"]}
  ]},
E:{
  label:"ชุดที่ 5",
  tag:"อิงหัวข้อและสไตล์จากข้อสอบ/รีวิวจริง",
  parts:[
  { title:"Part One", kind:"personal",

  { title:"Part Two", kind:"single", image:"readingCorner",

    caption:"Children sitting on different levels in a colourful reading corner, each with a book.",

      {time:45, q:"What kinds of books do children and young people read in your country these days?",

       vocab:["printed book","concentrate","shorter content"]}

  { title:"Part Three", kind:"compare", images:["chessGame","footballGame"],
    instruction:"เปรียบเทียบภาพ 2 ภาพ จากนั้นตอบคำถามต่อเนื่องอีก 2 ข้อ — ข้อละ 45 วินาที",
    captionA:"Two children playing chess at a table.",

    items:[

       tips:["ใช้โครงสร้างคู่ขนาน 'The first picture shows... The second picture shows...' — รูปแบบนี้ตรงกับข้อสอบจริงในพาร์ทนี้เป๊ะ ๆ","ปิดท้ายด้วยจุดร่วม (Both pictures show...) ก่อนชี้ความต่าง (energy level) เพื่อให้คำตอบมีโครงสร้างที่ครบถ้วน","ใช้ 'physically active' เป็นคำศัพท์เฉพาะทางที่ช่วยเพิ่ม vocabulary range"],

  { title:"Part Four", kind:"extended", image:"mentorObserve", prepTime:60, answerTime:120,
    instruction:"ดูภาพและอ่านคำถาม 3 ข้อ มีเวลาเตรียมตัว 1 นาที (จดโน้ตได้) จากนั้นตอบทั้ง 3 ข้อต่อเนื่องภายใน 2 นาที",
    caption:"A teacher being observed by a mentor while the rest of the class continues working.",
    subquestions:[
      "Talk about a time when you were observed by another teacher, or when you observed a colleague's lesson.",
      "How do you usually deal with disruptive students in your classroom?",
      "How useful is a mentoring scheme for new or trainee teachers?"
    ],
    model:"I clearly remember the first time I was formally observed, during my teacher-training course — the classroom felt very small that day, with the course tutor sitting quietly at the back taking notes. Afterwards, she gave me some really practical tips on lesson-planning and classroom management, especially how to deal with disruptive students, which was something I was struggling with at the time. As for disruptive behaviour now, I try to deal with it calmly and quietly rather than stopping the whole lesson, since making a big scene often makes things worse. Overall, I think a mentoring scheme is extremely useful for new teachers, because a more experienced colleague can often see things about your teaching that you simply can't notice yourself.",
    tips:["เล่าประสบการณ์ตรงเฉพาะเจาะจง (my first observation) ก่อน แล้วค่อยขยายไปคำถามทั่วไปข้อ 2-3 — โครงสร้างนี้ตรงกับตัวอย่างคำตอบจริงของข้อสอบชุดนี้","ใช้ 'As for... now...' เชื่อมจากเรื่องเล่าในอดีต (ข้อ 1) ไปสู่การปฏิบัติในปัจจุบัน (ข้อ 2) อย่างลื่นไหล","คำว่า 'making a big scene' และ 'a mentoring scheme' เป็นคำศัพท์ระดับ B2 ที่ควรมีติดตัวสำหรับหัวข้อนี้โดยเฉพาะ","จำไว้ว่ากรรมการฟังออกได้ถ้าคำตอบฟังดูท่องจำมาทั้งดุ้น ให้ฝึกจนคุ้นแล้วพูดด้วยคำของตัวเองในห้องสอบจริง"],
    vocab:["formally observed","classroom management","make a big scene","mentoring scheme"]}
  ]},
F:{
  label:"ชุดที่ 6",
  tag:"หัวข้อแปลกใหม่ อิงรีวิว/ข้อสอบจริงอีกชุด",
  parts:[
  { title:"Part One", kind:"personal",
    instruction:"ผู้คุมสอบจะถามคำถามสั้น ๆ เกี่ยวกับตัวคุณ 3 ข้อ — ข้อละ 30 วินาที",
    items:[
      {time:30, q:"How do you usually travel to work each day?",
       model:"I usually ride a motorbike to school, since I live fairly close by and it only takes about ten minutes. On days when it's raining heavily, though, I sometimes get a ride with a colleague instead, which is also a nice chance to chat before the school day starts.",
       tips:["ให้คำตอบหลักก่อน (ride a motorbike) แล้วเสริมเงื่อนไขพิเศษ (on days when...) เพื่อความสมจริง ไม่แข็งเกินไป","หัวข้อการเดินทาง/ยานพาหนะออกสอบจริงบ่อยใน Part 1 — ควรมีคำศัพท์ยานพาหนะและเวลาติดตัว (motorbike, ride, take (time))","ปิดท้ายด้วยข้อดีเล็ก ๆ ของทางเลือกสำรอง เพื่อยืดคำตอบอย่างเป็นธรรมชาติ"],
       vocab:["ride (a motorbike)","fairly close by","a ride (noun)"]},
      {time:30, q:"Tell me about a DIY or home project you have done.",
       model:"Last year, I repainted my bedroom by myself, which took much longer than I expected because I'd never done it before. It wasn't perfect — there were a few messy edges — but I was quite proud that I'd managed to do the whole room on my own.",
       tips:["ใช้ Past Simple + 'by myself/on my own' เพราะเป็นเรื่องเล่าประสบการณ์ส่วนตัว","ยอมรับข้อบกพร่องเล็กน้อย (a few messy edges) ทำให้คำตอบฟังดูจริงใจ ไม่ใช่คำตอบสมบูรณ์แบบเกินไป","หัวข้อ DIY เป็นหัวข้อที่ไม่ค่อยคาดคิดแต่เคยออกสอบจริง ควรเตรียมคำศัพท์งานบ้าน/ซ่อมแซมไว้บ้าง"],
       vocab:["repaint","by myself","messy"]},
      {time:30, q:"What is your favourite time of year, and why?",
       model:"I'd probably say the cool season, because the weather is much more comfortable for being outside, and it's also around the time we have a school break, so I get to relax a little. Everything just feels calmer during those months compared to the hot season.",
       tips:["ใช้ 'I'd probably say...' เพื่อแสดงความเห็นแบบไม่ฟันธงเกินไป เป็นธรรมชาติกว่า 'My favourite is...'","เชื่อมเหตุผลสองข้อด้วย 'and it's also...' เพื่อให้คำตอบมีน้ำหนักมากกว่าเหตุผลเดียว","ปิดท้ายด้วยการเปรียบเทียบกับฤดูอื่น (compared to...) เพื่อแสดงมุมมองที่ชัดเจนขึ้น"],
       vocab:["cool season","comfortable","a school break"]}
    ]},
  { title:"Part Two", kind:"single", image:"busExcursion",
    instruction:"บรรยายภาพ 1 ภาพ จากนั้นตอบคำถามต่อเนื่องอีก 2 ข้อ — ข้อละ 45 วินาที",
    caption:"Students with backpacks and suitcases, about to board a bus for a school excursion.",
    items:[
      {time:45, q:"Describe this picture.",
       model:"In this picture, I can see a group of students standing next to a bus, and they seem to be about to go on a trip. They've got backpacks and even a suitcase with them, so it might be a longer trip rather than just a short visit somewhere nearby. Everyone looks excited and ready to go.",
       tips:["สังเกตรายละเอียดเล็ก ๆ ในภาพ (a suitcase, not just backpacks) แล้วใช้เดาความยาวของทริป — เป็นทักษะที่ข้อสอบจริงเน้นวัด","ใช้ 'rather than' เพื่อเปรียบเทียบความเป็นไปได้สองแบบ (long trip vs short visit)","จบด้วยการบรรยายอารมณ์ในภาพ (excited and ready to go) เพื่อให้คำตอบไม่ใช่แค่ข้อเท็จจริงล้วน ๆ"],
       vocab:["excursion","about to (do something)","ready to go"]},
      {time:45, q:"What kind of school trips do students go on in your country?",
       model:"In my country, students often go on day trips to museums, historical sites or science centres, and older students sometimes go on longer trips, like an overnight camp. Trips like these are usually organised once or twice a term, depending on the school's budget and the subject being taught.",
       tips:["แบ่งคำตอบตามระยะเวลาทริป (day trip vs longer trip) เพื่อให้คำตอบมีโครงสร้างชัดเจน","เติมรายละเอียดเชิงปฏิบัติ (once or twice a term, budget) เพื่อแสดงความรู้เชิงลึกของครูจริง ๆ","ใช้ 'depending on...' ปิดท้ายเพื่อแสดงมุมมองที่ยืดหยุ่น ไม่ฟันธงตายตัว"],
       vocab:["day trip","overnight camp","budget"]},
      {time:45, q:"How do you prepare students before taking them on a trip outside school?",
       model:"Before a trip, I usually go through some basic safety rules with the students, like staying with their group and knowing who to contact if they get separated. I also try to give them a little background information about the place we're visiting, so they get more out of the experience instead of just seeing it as a day off from lessons.",
       tips:["ใช้ 'like...' ยกตัวอย่างกฎความปลอดภัยที่เป็นรูปธรรม แทนพูดกว้าง ๆ ว่า 'I prepare them'","เปรียบเทียบสองมุมมอง (get more out of the experience vs a day off) เพื่อแสดงเจตนาการสอนที่ลึกซึ้ง","โครงสร้าง 'instead of just...' ช่วยแสดงความคิดเห็นเชิงเปรียบเทียบได้ดีในคำตอบระดับนี้"],
       vocab:["safety rules","get separated","get more out of"]}
    ]},
  { title:"Part Three", kind:"compare", images:["busExcursion","artGallery"],
    instruction:"เปรียบเทียบภาพ 2 ภาพ จากนั้นตอบคำถามต่อเนื่องอีก 2 ข้อ — ข้อละ 45 วินาที",
    captionA:"Students about to board a bus for an excursion.",
    captionB:"Students on a school trip, looking at paintings in an art gallery.",
    items:[
      {time:45, q:"Tell me what you see in these two pictures.",
       model:"Both pictures show students on some kind of school trip, but the two situations look quite different. In the first picture, the students are outside, waiting to board a bus, with backpacks and luggage, so it looks like the start of a longer journey. In the second picture, the students are indoors in an art gallery, standing quietly and looking at paintings on the wall, which feels much calmer.",
       tips:["เริ่มด้วยจุดร่วม (Both pictures show...) ก่อนแยกไปบรรยายความต่าง — เป็นโครงสร้างที่ตรงกับคำตอบตัวอย่างจริงในหัวข้อนี้","ใช้ 'in the first picture / in the second picture' สลับกับ 'the students are...' เพื่อไม่ให้ประโยคซ้ำแบบเดิมทุกประโยค","ปิดท้ายด้วยความรู้สึกของแต่ละภาพ (calmer) เพื่อให้คำตอบมีมิติมากกว่าการบรรยายวัตถุอย่างเดียว"],
       vocab:["board (a bus)","luggage","indoors"]},
      {time:45, q:"Which of these two types of trip do you think students enjoy more, and why?",
       model:"I'd guess most students would prefer the excursion with the bus, simply because it feels more like an adventure and they usually get to spend time with their friends more freely. That said, a gallery visit can also be really enjoyable for students who are more interested in art, so it probably depends a lot on the individual student.",
       tips:["ใช้ 'I'd guess...' เพื่อแสดงว่าเป็นการคาดเดา (speculation) ตรงตามจุดประสงค์ของพาร์ทนี้","เสนอมุมมองที่สมดุล (That said...) แทนการฟันธงไปทางเดียว","จบด้วย 'it probably depends on...' เป็นวลีปิดคำตอบเชิงเปรียบเทียบที่ใช้ได้กับคำถามลักษณะนี้แทบทุกข้อ"],
       vocab:["an adventure","freely","depends on the individual"]},
      {time:45, q:"How important is it for schools to organise trips outside the classroom?",
       model:"I think it's genuinely important, because trips like these give students experiences and memories that a normal lesson simply can't provide. That said, they do take a lot of organising and can be expensive, so schools need to plan carefully to make sure every student can actually take part.",
       tips:["ใช้ 'genuinely important' แทน 'very important' เพื่อให้ฟังเป็นธรรมชาติและหลากหลายคำศัพท์มากขึ้น","ยอมรับข้อจำกัดเชิงปฏิบัติ (organising, expensive) ก่อนสรุป เพื่อแสดงมุมมองรอบด้าน","ปิดท้ายด้วยประเด็นความเท่าเทียม (every student can take part) ซึ่งเป็นมุมที่กรรมการมักประทับใจ"],
       vocab:["take a lot of organising","expensive","take part"]}
    ]},
  { title:"Part Four", kind:"extended", image:"startSchool", prepTime:60, answerTime:120,
    instruction:"ในพาร์ทนี้ภาพเป็นเพียง 'ฉากตั้งเรื่อง' เท่านั้น — ไม่ต้องบรรยายภาพ! ให้อ่านคำถาม 3 ข้อ เตรียมตัว 1 นาที แล้วเล่าความทรงจำต่อเนื่องภายใน 2 นาที",
    caption:"(ภาพนี้เป็นแค่ฉากตั้งเรื่อง ไม่ต้องบรรยายภาพในคำตอบของคุณ)",
    subquestions:[
      "Tell me what you can remember about starting school for the very first time.",
      "How did you feel on that day?",
      "Is there anything from that day that still affects how you teach now?"
    ],
    model:"I'll always remember the day I started primary school — I was holding my mother's hand so tightly at the gate that she had to gently remind me she'd be back to pick me up later. I'd never felt so nervous in my life, to be honest, because everything and everyone around me was completely new. Looking back now, I think that memory is actually part of why I make an effort to welcome new or nervous students so warmly today — I try to remember that, for them, that first day can feel exactly as overwhelming as it felt for me all those years ago.",
    tips:["พาร์ทนี้เป็นคนละแบบกับชุดก่อน ๆ — โจทย์จริงบางชุดให้ 'เล่าความทรงจำ' แทนการแสดงความเห็น และย้ำว่า 'ภาพเป็นแค่ฉาก ไม่ต้องบรรยาย' ต้องอ่านคำสั่งให้ดีทุกครั้งว่าพาร์ท 4 เป็นแบบไหน","ใช้ narrative tenses ให้หลากหลาย: past simple (started, felt), 'I'd never felt so...' (past perfect เพื่อเน้นความรู้สึกก่อนหน้า), 'I'll always remember...' เป็นวลีเปิดเรื่องที่เป็นธรรมชาติมาก","ข้อสุดท้ายเชื่อมความทรงจำในอดีตกลับมาสู่ปัจจุบัน (Looking back now...) ซึ่งเป็นสิ่งที่คำตอบระดับสูงมักทำได้ดี","แบ่งเวลาให้ 3 ข้อใกล้เคียงกัน — ข้อ 'ความรู้สึก' อาจสั้นกว่าข้ออื่นได้ตามธรรมชาติ ไม่ต้องกังวลถ้าสั้นกว่านิดหน่อย"],
    vocab:["hold (someone's) hand","overwhelming","looking back now"]}
  ]},
G:{
  label:"ชุดที่ 7",
  tag:"หัวข้อใหม่ เน้นสิ่งที่ออกจริง",
  parts:[
  { title:"Part One", kind:"personal",
    instruction:"ผู้คุมสอบจะถามคำถามสั้น ๆ เกี่ยวกับตัวคุณ 3 ข้อ — ข้อละ 30 วินาที",
    items:[
      {time:30, q:"Tell me about your favourite subject when you were a student.",
       model:"When I was at school, my favourite subject was actually science, mostly because of one teacher who made every lesson feel like a discovery rather than just facts to memorise. That's probably one of the reasons I ended up becoming a science teacher myself.",
       tips:["หัวข้อ 'ตอนเป็นนักเรียน' ออกสอบจริงบ่อยมาก ควรเตรียมคำตอบเรื่องวิชาที่ชอบไว้ล่วงหน้า","เชื่อมคำตอบกลับมาที่อาชีพครูปัจจุบัน (That's probably one of the reasons...) ให้คำตอบมีความต่อเนื่อง","ใช้ 'rather than' เพื่อเปรียบเทียบสองมุมมอง (discovery vs memorising facts)"],
       vocab:["a discovery","memorise","end up (doing something)"]},
      {time:30, q:"Describe a teacher who inspired you when you were young.",
       model:"I had a maths teacher who always had a lot of patience with students who were struggling, including me. She never made anyone feel embarrassed for asking a question twice, and I try to remember that patience whenever one of my own students is finding something difficult.",
       tips:["ยกตัวอย่างพฤติกรรมเฉพาะเจาะจง (never made anyone feel embarrassed) แทนคำคุณศัพท์กว้าง ๆ ว่า 'kind'","เชื่อมโยงกลับมาที่ตัวเองปัจจุบัน (I try to remember...) เพื่อแสดงว่าเป็นแรงบันดาลใจจริง","ใช้ Past Simple เล่าคุณลักษณะของครูคนนั้นตลอดประโยค"],
       vocab:["patience","embarrassed","struggling"]},
      {time:30, q:"What do you do during your lunch break at school?",
       model:"Most days, I eat lunch quickly with a couple of colleagues in the staff room, and then I use the rest of the break to prepare materials for my afternoon classes. It's not always very relaxing, to be honest, but it's a good chance to catch up with people.",
       tips:["ใช้ 'to be honest' แทรกความคิดเห็นจริงใจ ทำให้คำตอบไม่แข็งเกินไป","แบ่งคำตอบเป็นสองส่วน (eat lunch + prepare materials) เพื่อให้มีรายละเอียดมากกว่าคำตอบสั้น ๆ","จบด้วยข้อดีเล็ก ๆ (a good chance to catch up) แม้จะเริ่มด้วยข้อจำกัด (not always relaxing)"],
       vocab:["the staff room","catch up with","relaxing"]}
    ]},
  { title:"Part Two", kind:"single", image:"boardWriting",
    instruction:"บรรยายภาพ 1 ภาพ จากนั้นตอบคำถามต่อเนื่องอีก 2 ข้อ — ข้อละ 45 วินาที",
    caption:"A teacher at the whiteboard while a student comes up to write on the board too.",
    items:[
      {time:45, q:"Describe this picture.",
       model:"In this picture, a teacher is standing near the whiteboard, and it looks like a student has been invited up to write something on it as well, while the rest of the class works at their desks. It's not a completely typical classroom activity, but it seems like a nice way to get a student more involved than usual.",
       tips:["ใช้ 'It's not a completely typical activity, but...' เพื่อแสดงความเห็นเชิงสังเกตที่ลึกกว่าการบรรยายทั่วไป","สังเกตความสัมพันธ์ระหว่างคน 2 คนในภาพ (teacher + student) ก่อนขยายไปพื้นหลัง","ใช้ 'seems like' เมื่อตีความสิ่งที่กำลังเกิดขึ้นแบบไม่ฟันธง 100%"],
       vocab:["invited up","get (someone) involved","typical activity"]},
      {time:45, q:"How do you check students' homework in your class?",
       model:"I usually walk around and check quickly while students are doing a warm-up activity, rather than collecting every single book. Occasionally, though, I ask a student to write their answer on the board for everyone to check together, since it saves time and the whole class benefits from seeing the correction.",
       tips:["เปรียบเทียบสองวิธี (walk around vs write on board) เพื่อแสดงความยืดหยุ่นในการสอน","ใช้ 'rather than' และ 'though' เชื่อมความคิดที่ต่างกันในประโยคเดียว","อธิบายเหตุผลเชิงปฏิบัติ (saves time, whole class benefits) ไม่ใช่แค่บอกวิธีทำเฉย ๆ"],
       vocab:["a warm-up activity","occasionally","benefit from"]},
      {time:45, q:"How important is homework for language learning?",
       model:"I think it's fairly important, mainly because a fifty-minute lesson just isn't enough practice time on its own for a language. That said, I try not to give too much, since homework that's too long often gets rushed or copied, which honestly doesn't help anyone learn.",
       tips:["ให้ระดับความสำคัญก่อน (fairly important) แล้วอธิบายเหตุผลเชิงปฏิบัติ (not enough practice time)","เพิ่มมุมกังวล/ข้อจำกัด (that said...) เพื่อแสดงมุมมองที่สมดุล ไม่ใช่เห็นด้วยอย่างเดียว","ใช้ 'which honestly doesn't help anyone' แทรกน้ำเสียงความเห็นส่วนตัวแบบเป็นธรรมชาติ"],
       vocab:["practice time","rushed","copied (work)"]}
    ]},
  { title:"Part Three", kind:"compare", images:["studentsPhones","studentsBooks"],
    instruction:"เปรียบเทียบภาพ 2 ภาพ จากนั้นตอบคำถามต่อเนื่องอีก 2 ข้อ — ข้อละ 45 วินาที",
    captionA:"Students at their desks, each looking at a mobile phone.",
    captionB:"Students at their desks, each reading from a printed book.",
    items:[
      {time:45, q:"Tell me what you see in these two pictures.",
       model:"The first picture shows students working with their mobile phones at their desks, which could be for a lesson activity or possibly just for personal use. The second picture shows students reading from printed books instead, in a much more traditional way. Both groups look focused, but the tools they're using are completely different.",
       tips:["ใช้ 'could be... or possibly...' เพื่อเสนอความเป็นไปได้มากกว่าหนึ่งอย่างอย่างสมเหตุสมผล","ปิดท้ายด้วยจุดร่วม (Both groups look focused) ก่อนเน้นความต่าง (the tools) เพื่อให้คำตอบมีโครงสร้างครบ","หัวข้อโทรศัพท์ในห้องเรียนเป็นประเด็นถกเถียงจริงที่ออกสอบบ่อย ควรมีคำศัพท์และความเห็นเตรียมไว้"],
       vocab:["personal use","in a traditional way","focused"]},
      {time:45, q:"Should students be allowed to use mobile phones in lessons?",
       model:"I think it really depends on how they're used — if a phone is being used for a specific learning task, like a vocabulary app, then I don't see a problem. But if phones are allowed freely, they can easily become a distraction, so I'd say schools need very clear rules rather than a simple yes or no.",

H:{

  { title:"Part Two", kind:"single", image:"assembly",

I:{
  label:"ชุดที่ 9",
  tag:"เพื่อนร่วมงาน & ความเป็นอยู่ของนักเรียน",
  parts:[
  { title:"Part One", kind:"personal",
    instruction:"ผู้คุมสอบจะถามคำถามสั้น ๆ เกี่ยวกับตัวคุณ 3 ข้อ — ข้อละ 30 วินาที",
    items:[
      {time:30, q:"Tell me about the first week you spent at your current school.",

       tips:["ใช้ 'pretty overwhelming' แล้วขยายเหตุผลด้วยการยกตัวอย่างหลายอย่างพร้อมกัน (names, routines, layout)","ใช้ 'Luckily...' เปลี่ยนโทนจากลำบากไปสู่แง่บวก เพื่อให้คำตอบไม่หดหู่เกินไป","หัวข้อ 'first week/first day' ออกสอบจริงบ่อยมาก ควรเตรียมคำศัพท์เกี่ยวกับความรู้สึกช่วงเริ่มงานไว้"],

       tips:["แบ่งคำตอบเป็นหัวข้อเกี่ยวกับงาน (students) กับไม่เกี่ยวกับงาน (food, TV) เพื่อความหลากหลาย","ใช้ 'of course' แสดงว่าหัวข้อแรกเป็นเรื่องคาดเดาได้ ก่อนเสริมหัวข้อที่น่าสนใจกว่า","ปิดท้ายด้วยเหตุผลเชิงความสัมพันธ์ (feel more like a team) เพื่อให้คำตอบมีมิติ"],

  { title:"Part Two", kind:"single", image:"staffMeeting",
    instruction:"บรรยายภาพ 1 ภาพ จากนั้นตอบคำถามต่อเนื่องอีก 2 ข้อ — ข้อละ 45 วินาที",
    caption:"A group of teachers sitting around a table for a staff meeting.",
    items:[
      {time:45, q:"Describe this picture.",

       tips:["แยกบทบาทของคนในภาพ (discussing vs listening) เพื่อให้คำตอบมีรายละเอียดมากกว่าการบรรยายรวม ๆ","ใช้ 'rather than' เปรียบเทียบบรรยากาศที่เป็นไปได้ (relaxed vs formal/tense)","ใช้ 'seem to be / look like' บ่อย ๆ เมื่อตีความอารมณ์ในภาพที่ไม่แน่ใจ 100%"],
       vocab:["a staff meeting","actively","the atmosphere"]},
      {time:45, q:"What do teachers usually discuss in staff meetings at your school?",

      {time:45, q:"How useful do you find staff meetings?",

  { title:"Part Three", kind:"compare", images:["citySchool","ruralSchool"],

    items:[

      {time:45, q:"What are the main differences between teaching in a city school and a rural school?",
       model:"In my experience, city schools usually have more resources and a wider choice of teachers for each subject, while rural schools, like mine, often have to make do with fewer staff and older equipment. On the other hand, rural schools can feel more like a close community, since teachers often know every student's family personally.",
       tips:["ใช้ 'like mine' เชื่อมโยงกับประสบการณ์จริงของตัวเองถ้าตรงกับบริบท ทำให้คำตอบน่าเชื่อถือ","เปรียบเทียบข้อดี-ข้อเสียของทั้งสองฝั่งอย่างสมดุล (resources vs community)","ใช้ 'make do with' เป็นสำนวนที่แสดงถึงการปรับตัวกับทรัพยากรที่จำกัด"],
       vocab:["make do with","a close community","personally"]},
      {time:45, q:"Which do you think is more challenging, and why?",
       model:"I think they're challenging in different ways, rather than one being simply harder than the other. Rural schools can be tough because of limited resources, while city schools can be challenging because classes are often much larger, so it really depends on which kind of pressure a teacher finds harder to deal with.",
       tips:["ปฏิเสธการเปรียบเทียบแบบง่าย ๆ (rather than one being simply harder) เพื่อแสดงความคิดที่ละเอียดกว่า","ใช้โครงสร้างคู่ขนาน (X can be tough because... while Y can be challenging because...) ให้คำตอบเป็นระเบียบ","จบด้วย 'it really depends on...' เป็นวลีปิดคำตอบเชิงเปรียบเทียบที่ใช้ซ้ำได้หลายหัวข้อ"],
       vocab:["in different ways","limited resources","deal with (pressure)"]}
    ]},
  { title:"Part Four", kind:"extended", image:"lonelyStudent", prepTime:60, answerTime:120,
    instruction:"ดูภาพและอ่านคำถาม 3 ข้อ มีเวลาเตรียมตัว 1 นาที (จดโน้ตได้) จากนั้นตอบทั้ง 3 ข้อต่อเนื่องภายใน 2 นาที",
    caption:"A student sitting alone while other students play together in the background.",
    subquestions:[
      "Talk about a time you noticed a student was having a difficult time, socially or emotionally.",
      "How do you support students' wellbeing in your classroom, beyond just teaching the subject?",
      "How important is it for teachers to be trained in supporting student mental health?"

    model:"A couple of years ago, I noticed one of my students becoming much quieter than usual and sitting alone during breaks, which was quite different from how she normally behaved. I made a point of checking in with her privately, without making a big deal of it in front of the other students, and it turned out she was going through a difficult time at home. Beyond just teaching my subject, I try to keep an eye on things like that for all my students, even though I'm not trained as a counsellor. Honestly, I think teachers really do need at least some basic training in this area, because we often notice these changes long before anyone else does.",
    tips:["เล่าเหตุการณ์เฉพาะเจาะจง (a student becoming quieter) ก่อน แล้วค่อยขยายไปวิธีรับมือและความเห็นทั่วไป","ใช้ 'without making a big deal of it' แสดงความละเอียดอ่อนในการดูแลนักเรียน เป็นทักษะภาษาระดับสูง","เชื่อม 3 คำตอบด้วย 'Beyond just teaching...' และ 'Honestly, I think...' ให้ลื่นไหลเป็นเรื่องเดียวกัน","หัวข้อ wellbeing เป็นหัวข้อ 'abstract' แนวใหม่ที่เริ่มพบในข้อสอบจริง ควรเตรียมคำศัพท์ด้านอารมณ์/จิตใจไว้บ้าง"],
    vocab:["check in with (someone)","going through a difficult time","a counsellor"]}
  ]},
J:{
  label:"ชุดที่ 10",
  tag:"ข้อสอบ วิธีสอน และอนาคตในอาชีพครู",
  parts:[
  { title:"Part One", kind:"personal",
    instruction:"ผู้คุมสอบจะถามคำถามสั้น ๆ เกี่ยวกับตัวคุณ 3 ข้อ — ข้อละ 30 วินาที",

       vocab:["exhausting","manage to (do something)","a strict schedule"]},
      {time:30, q:"How do you feel when the exam period is approaching?",
       model:"Honestly, I feel a bit more stressed than usual, mainly because there's extra marking and I also want to make sure my students feel prepared and calm. I try to stay organised in the weeks before exams, since that helps me manage the workload without feeling too overwhelmed.",
       tips:["ยอมรับความเครียดอย่างตรงไปตรงมา (Honestly, I feel...) แทนการตอบแบบเป็นทางการเกินไป","แยกเหตุผลความเครียดเป็นสองส่วน (extra marking + students' feelings) เพื่อความครบถ้วน","ปิดท้ายด้วยวิธีรับมือ (stay organised) เพื่อแสดงว่าไม่ใช่แค่บ่น แต่มีทางออกด้วย"],
       vocab:["stressed","the workload","stay organised"]},
      {time:30, q:"Tell me about a lesson that didn't go as planned.",

       tips:["ใช้ 'far too complicated' และ 'cut it short' เป็นคำศัพท์ที่ใช้บรรยายบทเรียนที่ผิดพลาดได้ดี","จบด้วยบทเรียนที่ได้ (it taught me to...) แทนการจบด้วยความล้มเหลวเฉย ๆ — ทำให้คำตอบดูเป็นผู้ใหญ่","หัวข้อ 'lesson that went wrong' ออกสอบจริงบ่อย ควรมีเรื่องเล่าเตรียมไว้อย่างน้อยหนึ่งเรื่อง"],
       vocab:["far too (complicated)","cut (something) short","a back-up version"]}
    ]},
  { title:"Part Two", kind:"single", image:"examHall",
    instruction:"บรรยายภาพ 1 ภาพ จากนั้นตอบคำถามต่อเนื่องอีก 2 ข้อ — ข้อละ 45 วินาที",
    caption:"Students sitting individually at spaced-out desks during an exam.",
    items:[
      {time:45, q:"Describe this picture.",
       model:"In this picture, I can see students sitting individually at desks that have been spaced quite far apart, which makes me think it's an exam. There's a clock visible on the wall too, so time management is probably part of the task. Everyone looks quiet and focused, which is fairly typical for this kind of situation.",
       tips:["สังเกตรายละเอียดที่บ่งบอกบริบท (spaced-out desks, a clock) แล้วใช้เดาสถานการณ์อย่างมีเหตุผล","ใช้ 'which makes me think...' เพื่อแสดงการอนุมานจากสิ่งที่เห็นในภาพ","ปิดท้ายด้วยลักษณะบรรยากาศทั่วไป (fairly typical for this kind of situation)"],
       vocab:["spaced (out)","time management","typical"]},
      {time:45, q:"How do you help students manage exam stress?",
       model:"I try to remind students that one exam doesn't define them, which sounds simple but genuinely helps some of them relax a little. Practically, I also give them some past papers to practise with beforehand, so the format itself doesn't feel unfamiliar or frightening on the actual day.",
       tips:["แยกความช่วยเหลือเป็นด้านจิตใจ (doesn't define them) กับด้านปฏิบัติ (past papers) เพื่อความครบถ้วน","ใช้ 'which sounds simple but genuinely helps' แสดงความเห็นที่มีมิติ ไม่ใช่คำตอบผิวเผิน","คำว่า 'unfamiliar' และ 'frightening' ช่วยอธิบายความรู้สึกของนักเรียนได้ตรงประเด็น"],
       vocab:["define (someone)","past papers","unfamiliar"]},
      {time:45, q:"Do you think there is too much emphasis on exams in education today?",
       model:"To some extent, yes — I think exams are useful for measuring certain skills, but they don't really show the whole picture of a student's ability. I'd like to see more balance, with things like projects or presentations counting for more, rather than everything depending on one single test.",
       tips:["ใช้ 'To some extent, yes...' เป็นวิธีตอบคำถามความเห็นแบบมีเงื่อนไข ไม่ใช่ yes/no ตรง ๆ","เสนอทางเลือกที่เป็นรูปธรรม (projects or presentations) แทนวิจารณ์ระบบเฉย ๆ","ใช้ 'the whole picture' เป็นสำนวนที่ช่วยแสดงความเห็นเชิงวิพากษ์อย่างสุภาพ"],
       vocab:["to some extent","measure (skills)","the whole picture"]}
    ]},
  { title:"Part Three", kind:"compare", images:["textbookLesson","mediaLesson"],
    instruction:"เปรียบเทียบภาพ 2 ภาพ จากนั้นตอบคำถามต่อเนื่องอีก 2 ข้อ — ข้อละ 45 วินาที",
    captionA:"A student reading from a printed textbook at their desk.",
    captionB:"A student watching a video with headphones on at their desk.",
    items:[
      {time:45, q:"Tell me what you see in these two pictures.",
       model:"The first picture shows a student reading quietly from a printed textbook, which looks like a fairly traditional, self-paced kind of study. The second picture shows a student wearing headphones and watching something on a screen, which is probably a video or listening exercise. Both students seem equally focused, just using very different kinds of materials.",
       tips:["ใช้ 'self-paced' เป็นคำศัพท์เฉพาะทางที่อธิบายลักษณะการเรียนจากหนังสือได้ดี","เดาชนิดสื่อในภาพที่สอง (probably a video or listening exercise) อย่างสมเหตุสมผล","ปิดท้ายด้วยจุดร่วม (equally focused) ก่อนเน้นความต่าง (materials) เพื่อความครบถ้วน"],
       vocab:["self-paced","a listening exercise","materials"]},
      {time:45, q:"Which approach do you think helps students learn a language more effectively?",
       model:"I don't think one is definitely better than the other — textbooks are great for building solid grammar and vocabulary, while authentic media like videos exposes students to more natural, real-life language. In my experience, a combination of both usually works best, rather than relying on just one type of material.",
       tips:["ปฏิเสธการเลือกฝั่งเดียวตั้งแต่ต้น (I don't think one is definitely better) เพื่อแสดงมุมมองที่สมดุล","เปรียบเทียบจุดแข็งของแต่ละฝั่งอย่างชัดเจน (solid grammar vs natural language)","ปิดท้ายด้วยข้อเสนอ 'a combination of both' ซึ่งเป็นคำตอบที่กรรมการมักให้คะแนนดีเพราะแสดงความคิดที่รอบด้าน"],
       vocab:["authentic media","expose (students) to","a combination of"]},
      {time:45, q:"How do you decide when to use authentic materials like songs or videos in your teaching?",
       model:"It really depends on the lesson's goal — if I want students to notice natural pronunciation or informal expressions, a short video or song usually works well. But if the goal is to practise a specific grammar point carefully, I tend to stick with more controlled textbook material instead.",
       tips:["เชื่อมโยงการตัดสินใจกับเป้าหมายบทเรียน (the lesson's goal) เพื่อแสดงกระบวนการคิดเชิงการสอน","ใช้ 'tend to' แสดงพฤติกรรมที่ทำเป็นส่วนใหญ่ ไม่ใช่ทุกครั้งแบบตายตัว","เปรียบเทียบสถานการณ์สองแบบ (natural pronunciation vs specific grammar point) เพื่อความชัดเจน"],
       vocab:["informal expressions","controlled material","tend to"]}
    ]},
  { title:"Part Four", kind:"extended", image:"futurePlans", prepTime:60, answerTime:120,
    instruction:"ดูภาพและอ่านคำถาม 3 ข้อ มีเวลาเตรียมตัว 1 นาที (จดโน้ตได้) จากนั้นตอบทั้ง 3 ข้อต่อเนื่องภายใน 2 นาที",
    caption:"A teacher standing at a fork in the path, looking ahead.",
    subquestions:[
      "Talk about your plans for your teaching career over the next few years.",

    model:"Over the next few years, I'd like to take on a bit more responsibility at school, maybe supporting newer teachers, while also continuing to improve my own English. As for the profession in general, I think teaching will probably rely more on technology and data to track student progress, although I don't think the core job — actually connecting with students — will ever really change. If I had to give advice to someone thinking about becoming a teacher, I'd tell them to go in with realistic expectations: it's genuinely rewarding, but it's also far more demanding than most people expect before they start.",
    tips:["ใช้ 'Over the next few years...' เปิดคำตอบข้อ 1 ให้ชัดเจนว่าเป็นแผนระยะสั้น-กลาง","เชื่อม 'As for the profession in general...' และ 'If I had to give advice...' เพื่อร้อยเรียง 3 คำตอบให้เป็นเรื่องเดียวกัน","ใช้ 'go in with realistic expectations' เป็นคำแนะนำที่ฟังดูมีประสบการณ์จริง ไม่ใช่คำแนะนำผิวเผิน","หัวข้ออนาคต/คำแนะนำอาชีพเป็นหนึ่งใน abstract topics ที่พบได้จริงในพาร์ท 4 ควรฝึกให้คล่องเพราะต้องใช้ทั้งอดีต-ปัจจุบัน-อนาคตในคำตอบเดียว"],
    vocab:["take on responsibility","track progress","realistic expectations"]}

K:{
  label:"ชุดที่ 11",

  parts:[
  { title:"Part One", kind:"personal",

       tips:["ใช้ 'even though' ยอมรับจุดอ่อนของตัวเองอย่างเป็นธรรมชาติ ไม่ต้องสมบูรณ์แบบ","เปรียบเทียบงานอดิเรกกับอาชีพครู (a nice contrast to teaching) เพื่อให้คำตอบมีมิติมากกว่าการบรรยายเฉย ๆ","จบด้วยเหตุผลว่าทำไมชอบกิจกรรมนี้ (relaxing after a busy week)"],

       vocab:["catch up on sleep","exhausting","productive"]}

  { title:"Part Two", kind:"single", image:"mixedAbility",
    instruction:"บรรยายภาพ 1 ภาพ จากนั้นตอบคำถามต่อเนื่องอีก 2 ข้อ — ข้อละ 45 วินาที",
    caption:"A teacher helping one group of students while others work independently on a different task.",
    items:[

       vocab:["core task","an extra challenge","preparation time"]},
      {time:45, q:"What challenges do you face when some students finish work much faster than others?",

}

    <div class="eyebrow">${part.title} · เฉลยแนวทาง</div>

    <p class="lede">ฟังเสียงที่อัดไว้ของคุณ แล้วเทียบกับตัวอย่างคำตอบและคำแนะนำด้านล่าง</p>
  </div>
  ${isExt? reviewExtended(part) : reviewItems(part)}
  <div class="criteria-note"><b>เกณฑ์การให้คะแนน Speaking โดยทั่วไป:</b> ความถูกต้อง/ความหลากหลายของไวยากรณ์และคำศัพท์ (Grammar & Vocabulary), การเรียบเรียงความคิดให้ต่อเนื่อง (Discourse Management), และการออกเสียง (Pronunciation) — ควรตอบให้ครบเวลาที่กำหนดและมีการเชื่อมประโยคด้วยคำเชื่อมอย่างสม่ำเสมอ</div>
  <div class="btnrow">
    <button class="btn ghost" onclick="goPrevious()">← ย้อนกลับไปทำใหม่</button>
    <button class="btn" onclick="nextPart()">${state.partIdx<3?'ไปพาร์ทถัดไป':'ดูสรุปผล'}</button>
  </div>`;
},

summary(){
  return `${rail()}
  <div class="card">
    <div class="eyebrow">เสร็จสิ้นการฝึกซ้อม</div>
    <h1 class="pagetitle">ทำครบทั้ง 4 พาร์ทแล้ว 🎉</h1>
    <p class="lede">ลองประเมินตัวเองตามหัวข้อด้านล่าง ก่อนกลับไปฝึกซ้ำ หรือเปลี่ยนไปลองอีกชุดหนึ่ง</p>
    <div class="checklist">
      ${["ฉันตอบได้จนเกือบครบเวลาที่กำหนดในแต่ละข้อ (ไม่เงียบเร็วเกินไป)",
         "ฉันใช้คำเชื่อมประโยค เช่น because, although, so, which ในคำตอบ",
         "ฉันให้เหตุผลประกอบความเห็นทุกครั้ง ไม่ตอบสั้นห้วน ๆ",
         "ในพาร์ท 4 ฉันแบ่งเวลาตอบทั้ง 3 คำถามใกล้เคียงกัน ไม่หมดเวลากับข้อแรก",
         "ฉันฟังเสียงตัวเองแล้วสังเกตจุดที่ออกเสียงไม่ชัดหรือพูดติดขัด"
      ].map(t=>`<label class="checkrow"><input type="checkbox"><span>${t}</span></label>`).join('')}
    </div>
    <div class="btnrow">
      <button class="btn ghost" onclick="goPrevious()">← ย้อนกลับ</button>
      <button class="btn" onclick="restartSameSet()">ฝึกชุดนี้อีกครั้ง</button>
      <button class="btn secondary" onclick="goLanding()">เลือกชุดอื่น</button>
    </div>
  </div>`;
}
};

function reviewItems(part){
  return part.items.map((item,i)=>{
    const key = `${state.partIdx}-${i}`;
    const rec = state.recordings[key];
    return `<div class="review-item">
      <div class="review-q">${i+1}. ${item.q}</div>
      ${rec? `<div class="review-audio"><audio controls src="${rec}"></audio></div>` : `<div class="rec-hint">(ไม่มีการอัดเสียงสำหรับข้อนี้)</div>`}
      <div class="model"><div class="lbl">ตัวอย่างคำตอบ</div><p>${item.model}</p></div>
      <ul class="tips">${item.tips.map(t=>`<li>${t}</li>`).join('')}</ul>
      <div class="vocab">${item.vocab.map(v=>`<span>${v}</span>`).join('')}</div>
    </div>`;
  }).join('');
}
function reviewExtended(part){
  const key = `${state.partIdx}-ext`;
  const rec = state.recordings[key];
  return `<div class="review-item">
    <div class="review-q">${part.subquestions.map((q,i)=>`${i+1}. ${q}`).join('<br>')}</div>
    ${rec? `<div class="review-audio"><audio controls src="${rec}"></audio></div>` : `<div class="rec-hint">(ไม่มีการอัดเสียงสำหรับข้อนี้)</div>`}
    <div class="model"><div class="lbl">ตัวอย่างคำตอบ (รวม 3 ข้อ)</div><p>${part.model}</p></div>
    <ul class="tips">${part.tips.map(t=>`<li>${t}</li>`).join('')}</ul>
    <div class="vocab">${part.vocab.map(v=>`<span>${v}</span>`).join('')}</div>
  </div>`;
}

function recPanel(seconds, isPrep){
  return `<div class="rec-panel">
    <button class="btn ghost small" id="prevBtn" onclick="goPrevious()" style="margin-bottom:12px;">← ย้อนกลับ</button>
    <div class="rec-state" id="recState">${isPrep? 'กำลังเตรียมตัว' : 'พร้อมเริ่มอัด'}</div>
    <div class="timer-ring" id="ring"><div class="timer-num" id="timeNum">${seconds}</div></div>
    <div class="wave" id="wave">${Array.from({length:14}).map(()=>'<span></span>').join('')}</div>
    <div class="rec-hint" id="recHint">${isPrep? 'ใช้เวลานี้จดโน้ตสั้น ๆ' : 'กดปุ่มเพื่อเริ่มพูด'}</div>
    <div class="rec-btnrow">
      ${isPrep
        ? `<button class="btn" id="primaryBtn" onclick="skipItem()">เริ่มตอบเลย (ข้ามเวลาเตรียม)</button>`
        : `<button class="btn" id="primaryBtn" onclick="handlePrimary()">เริ่มพูด</button>
           <button class="btn ghost small" id="skipBtn" onclick="skipItem()">ข้ามข้อนี้ ไม่บันทึกเสียง ➜</button>`
      }
    </div>
    <div class="mic-note" id="micNote"></div>
  </div>`;
}

/* ============================= FLOW CONTROL ============================= */
function pickSet(k){ state.setKey=k; render(); }
function startTest(){ state.partIdx=0; state.itemIdx=0; state.recordings={}; state.screen='partIntro'; render(); }
function beginPart(){
  const part = SETS[state.setKey].parts[state.partIdx];
  state.itemIdx=0;
  state.phase = part.kind==='extended' ? 'prep' : 'record';
  state.screen='record';
  render();
}
function goLanding(){ state.screen='landing'; state.setKey=null; render(); }
function restartSameSet(){ startTest(); }

function nextPart(){
  if(state.partIdx<3){ state.partIdx++; state.screen='partIntro'; render(); }
  else { state.screen='summary'; render(); }
}

// "Previous" — step back one screen from wherever the user currently is,
// safely discarding any timer/recording in progress along the way.
function goPrevious(){
  clearInterval(timerHandle); clearInterval(waveHandle);
  if(mediaRecorder && mediaRecorder.state==='recording'){
    discardOnStop = true;
    try{ mediaRecorder.stop(); }catch(e){}
  }
  if(mediaStream){ try{ mediaStream.getTracks().forEach(t=>t.stop()); }catch(e){} }

  if(state.screen==='partIntro'){
    if(state.partIdx>0){ state.partIdx--; state.screen='review'; }
    else { state.screen='landing'; state.setKey=null; }
    render(); return;
  }
  if(state.screen==='record'){
    const part = SETS[state.setKey].parts[state.partIdx];
    if(part.kind==='extended'){
      if(state.phase==='record'){ state.phase='prep'; render(); return; }
      state.screen='partIntro'; render(); return;
    }
    if(state.itemIdx>0){ state.itemIdx--; render(); return; }
    state.screen='partIntro'; render(); return;
  }
  if(state.screen==='review'){
    const part = SETS[state.setKey].parts[state.partIdx];
    if(part.kind==='extended'){ state.phase='record'; state.screen='record'; render(); return; }
    state.itemIdx = part.items.length-1; state.screen='record'; render(); return;
  }
  if(state.screen==='summary'){
    state.partIdx=3; state.screen='review'; render(); return;
  }
}

function advanceAfterRecording(blobUrl){
  const part = SETS[state.setKey].parts[state.partIdx];
  if(part.kind==='extended'){
    if(state.phase==='prep'){
      state.phase='record';
      state.screen='record';
      render();
      return;
    } else {
      state.recordings[`${state.partIdx}-ext`] = blobUrl;
      state.screen='review'; render(); return;
    }
  }
  state.recordings[`${state.partIdx}-${state.itemIdx}`] = blobUrl;
  if(state.itemIdx < part.items.length-1){
    state.itemIdx++; render();
  } else {
    state.screen='review'; render();
  }
}

/* ============================= TIMER + RECORDING ============================= */
function afterRender(){
  clearInterval(timerHandle); clearInterval(waveHandle);
  if(state.screen!=='record') return;
  const part = SETS[state.setKey].parts[state.partIdx];
  const isExtPrep = part.kind==='extended' && state.phase==='prep';
  const seconds = part.kind==='extended' ? (state.phase==='prep'?part.prepTime:part.answerTime) : part.items[state.itemIdx].time;
  let remaining = seconds;
  let started = isExtPrep; // prep counts down automatically without mic
  const ring = el('ring'), num = el('timeNum'), stateLbl = el('recState'), hint = el('recHint'), btn = el('primaryBtn');

  function tick(){
    num.textContent = remaining;
    if(remaining<=0){
      clearInterval(timerHandle);
      if(isExtPrep){ advanceAfterRecording(null); }
      else { stopRecording(); }
      return;
    }
    remaining--;
  }

  if(isExtPrep){
    ring.classList.add('live'); stateLbl.textContent='กำลังเตรียมตัว'; stateLbl.classList.add('live');
    timerHandle = setInterval(tick,1000);
    return;
  }

  window.__startRecording = function(){
    btn.disabled = true; btn.textContent='กำลังอัด...';
    ring.classList.add('live'); stateLbl.textContent='กำลังอัดเสียง'; stateLbl.classList.add('live');
    hint.textContent='กดปุ่มด้านล่างเมื่อพูดจบก่อนหมดเวลาได้';
    timerHandle = setInterval(tick,1000);
    beginMic(remaining);
  };
}

function handlePrimary(){
  if(window.__startRecording) window.__startRecording();
}

function beginMic(seconds){
  const btn = el('primaryBtn'), skip = el('skipBtn');
  const finishLater = ()=>{
    btn.textContent='จบและไปข้อต่อไป';
    btn.onclick = stopRecording;
    if(skip) skip.textContent='ยกเลิก ไม่บันทึกเสียงนี้ ➜';
  };
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    micOK=false; el('micNote').textContent='เบราว์เซอร์นี้ไม่รองรับการอัดเสียง — ฝึกพูดตามเวลาไปก่อนแล้วดูเฉลยได้เลย';
    finishLater(); return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    micOK=true; mediaStream=stream;
    mediaChunks=[];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e=>mediaChunks.push(e.data);
    mediaRecorder.onstop = ()=>{
      const blob = new Blob(mediaChunks, {type:'audio/webm'});
      const url = discardOnStop ? null : URL.createObjectURL(blob);
      discardOnStop = false;
      stream.getTracks().forEach(t=>t.stop());
      advanceAfterRecording(url);
    };
    mediaRecorder.start();
    startWave();
    finishLater();
  }).catch(()=>{
    micOK=false; el('micNote').textContent='ไม่ได้รับอนุญาตให้ใช้ไมโครโฟนในหน้าต่างนี้ — ฝึกพูดออกเสียงตามเวลาได้เลย แล้วดูเฉลยตอนจบข้อ';
    finishLater();
  });
}

function startWave(){
  const bars = document.querySelectorAll('#wave span');
  waveHandle = setInterval(()=>{
    bars.forEach(b=> b.style.height = (4+Math.random()*20)+'px');
  },140);
}

// "Finish" — stop early but keep whatever was recorded so far, then move on.
function stopRecording(){
  clearInterval(timerHandle); clearInterval(waveHandle);
  discardOnStop = false;
  if(mediaRecorder && mediaRecorder.state==='recording'){
    mediaRecorder.stop();
  } else {
    advanceAfterRecording(null);
  }
}

// "Skip" — jump to the next item immediately, at any point (prep, before
// recording starts, or mid-recording). Any in-progress recording is discarded.
function skipItem(){
  clearInterval(timerHandle); clearInterval(waveHandle);
  if(mediaRecorder && mediaRecorder.state==='recording'){
    discardOnStop = true;
    mediaRecorder.stop();
  } else {
    if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); }
    advanceAfterRecording(null);
  }
}

render();
</script>
</body>
</html>
